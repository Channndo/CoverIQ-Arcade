<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=square1-1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=square1-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Square1 Arcade — A futuristic indie arcade universe by Square1 Studios (an Omnistrata studio). Retro soul, modern tech, infinite worlds."
    />
    <title>Square1 Arcade — A Square1 Studios Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background:#05050c">
    <div id="root">
      <p id="boot-status" style="margin:0;padding:40vh 24px 0;text-align:center;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#7dd3fc">
        Loading arcade…
      </p>
    </div>
    <script>
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-status");
          if (!el) return;
          el.style.color = "#fca5a5";
          el.textContent = "The arcade couldn't start on this device. " + msg;
        }
        window.addEventListener("error", function (e) {
          show(e.message ? "(" + e.message + ")" : "(a file failed to load)");
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show("(" + String(e.reason && e.reason.message || e.reason) + ")");
        });
        setTimeout(function () {
          show("Try refreshing, or turn off content blockers for this site.");
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
